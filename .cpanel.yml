---
# cPanel Git Version Control dagitim betigi.
#
# BES KURAL (baska projede yanarak ogrenildi, bozmayin):
#   1. Her gorev TEK SATIR. Cok satirli komut ayristiriciyi kirar.
#   2. Metinlerde iki nokta + BOSLUK kullanma. "ENV: VAR" gibi bir echo
#      dosyayi gecersiz YAML yapar; cPanel deploy'u SESSIZCE dusurur ve
#      "Last Deployed" son basarili commit'te donar. Hata gorunmez.
#   3. Mutlak yol kullan. Deploy kabugunun PATH'i dar. rsync cogu sunucuda
#      YOK — kopyalama /bin/cp ile ve dizinler tek tek sayilarak yapilir.
#   4. .env ve storage/ kopyalanmaz; ama storage/framework iskeleti
#      mkdir -p ile kurulur, ilk deploy'da yoktur.
#   5. Kendi gunlugunu yaz. cPanel'in gunlugunu aramaktan iyidir.
#
# Degisken kullanilmiyor: gorevler ayri kabukta calisirsa export kaybolur.
# Yollar birebir yazili. Hesap degisirse tumunu degistirin (kibr4830).
#
# Gunluk: /home/kibr4830/deploy-son.log
# Dosya Yoneticisi'nden acip okuyun.

deployment:
  tasks:
    - /bin/echo "===== DEPLOY BASLADI =====" > /home/kibr4830/deploy-son.log 2>&1
    - /bin/date >> /home/kibr4830/deploy-son.log 2>&1
    - php -v >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/mkdir -p /home/kibr4830/public_html >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/app >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/bootstrap >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/config >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/database >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/lang >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/public >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/resources >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/routes >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/echo "----- dosyalar kopyalaniyor -----" >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/app/. /home/kibr4830/public_html/app/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/bootstrap/. /home/kibr4830/public_html/bootstrap/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/config/. /home/kibr4830/public_html/config/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/database/. /home/kibr4830/public_html/database/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/lang/. /home/kibr4830/public_html/lang/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/public/. /home/kibr4830/public_html/public/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/resources/. /home/kibr4830/public_html/resources/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/routes/. /home/kibr4830/public_html/routes/ >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/artisan /home/kibr4830/public_html/artisan >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/composer.json /home/kibr4830/public_html/composer.json >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/composer.lock /home/kibr4830/public_html/composer.lock >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/cp -a /home/kibr4830/repositories/kibriswebtasarimci/.htaccess /home/kibr4830/public_html/.htaccess >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/echo "----- storage iskeleti -----" >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/storage/app/public >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/storage/framework/cache/data >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/storage/framework/sessions >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/storage/framework/views >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/storage/logs >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/mkdir -p /home/kibr4830/public_html/bootstrap/cache >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/chmod -R 775 /home/kibr4830/public_html/storage >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/chmod -R 775 /home/kibr4830/public_html/bootstrap/cache >> /home/kibr4830/deploy-son.log 2>&1

    # composer PATH'te yok. cPanel/CloudLinux'ta bilinen yollar sirayla denenir;
    # hicbiri yoksa vendor/ elle yuklenmis olmali (vendor-production.zip).
    - /bin/echo "----- composer -----" >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction || /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction || /usr/bin/composer install --no-dev --optimize-autoloader --no-interaction || composer install --no-dev --optimize-autoloader --no-interaction || /bin/echo "composer bulunamadi, vendor elle yuklenmis olmali" ) >> /home/kibr4830/deploy-son.log 2>&1

    # APP_KEY yoksa Laravel hic acilmaz (MissingAppKeyException -> 500).
    # Anahtar SUNUCUDA uretilir, boylece hicbir yerde acikta dolasmaz.
    # grep guard'i kritik: her dagitimda yeniden uretilse tum oturumlar ve
    # sifrelenmis veriler gecersiz olurdu.
    - /bin/echo "----- uygulama anahtari -----" >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && ( /bin/grep -q "^APP_KEY=base64" .env && /bin/echo "APP_KEY zaten tanimli" || php artisan key:generate --force ) || /bin/echo "vendor yok, anahtar atlandi" ) >> /home/kibr4830/deploy-son.log 2>&1

    # vendor yoksa artisan hic calismaz. Guard olmadan deploy gunlugu
    # okunmaz fatal error yiginina donuyor.
    # SIRA ONEMLI: optimize:clear GOCTEN ONCE. Aksi halde migrate, bir onceki
    # dagitimdan kalan onbellekli yapilandirmayla calisiyor; .env degistiyse
    # yanlis veritabanina baglanabiliyor.
    - /bin/echo "----- onbellek temizligi -----" >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && php artisan optimize:clear || /bin/echo "vendor yok, onbellek atlandi" ) >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/echo "----- veritabani -----" >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && php artisan migrate --force --no-interaction || /bin/echo "MIGRATE BASARISIZ ya da vendor yok" ) >> /home/kibr4830/deploy-son.log 2>&1
    # Gocun gercekten islendigini gunlukte gormek icin: bekleyen kalirsa burada gorunur.
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && php artisan migrate:status || /bin/true ) >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/echo "----- onbellek -----" >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && php artisan optimize || /bin/true ) >> /home/kibr4830/deploy-son.log 2>&1
    - cd /home/kibr4830/public_html && ( [ -f vendor/autoload.php ] && php artisan storage:link || /bin/true ) >> /home/kibr4830/deploy-son.log 2>&1

    - /bin/echo "===== DEPLOY BITTI =====" >> /home/kibr4830/deploy-son.log 2>&1
    - /bin/date >> /home/kibr4830/deploy-son.log 2>&1
