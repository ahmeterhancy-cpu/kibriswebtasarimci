---
# cPanel Git Version Control dağıtım betiği — SSH'sız kurulum.
#
# cPanel'de "Deploy HEAD Commit" düğmesine basıldığında bu görevler sunucuda
# ÇALIŞIR. Yani SSH ile giriş yapamasanız bile buradaki komutlar işler;
# composer ve artisan bu sayede kullanılabiliyor.
#
# Yollar bu hesaba göre ayarlandı (cPanel kullanıcısı: kibr4830).
# Hesap değişirse aşağıdaki iki export satırını güncelleyin.

deployment:
  tasks:
    - export DEPLOYPATH=/home/kibr4830/public_html
    - export REPOPATH=/home/kibr4830/repositories/kibriswebtasarimci

    # --- Uygulama dosyaları -------------------------------------------------
    # KOPYALANMAYANLAR ve sebepleri:
    #   .env      → sunucuda elle oluşturuldu, üzerine yazılmamalı
    #   storage/  → yüklenen görseller ve loglar burada
    #   vendor/   → depoda yok; ilk kurulumda elle yüklenir (bkz. DEPLOY.md)
    - /bin/rsync -av --delete
        --exclude='.git'
        --exclude='.env'
        --exclude='storage/'
        --exclude='vendor/'
        --exclude='node_modules/'
        --exclude='tests/'
        --exclude='*.zip'
        $REPOPATH/ $DEPLOYPATH/

    # --- Bağımlılıklar ------------------------------------------------------
    # Sunucuda composer varsa kullanır. Yoksa hata vermeden geçer; o durumda
    # vendor/ klasörünü bir kez elle yüklemeniz yeterli (her dağıtımda değil).
    - cd $DEPLOYPATH && (command -v composer >/dev/null 2>&1 && composer install --no-dev --optimize-autoloader --no-interaction || echo "composer yok — vendor/ elle yuklenmis olmali")

    # --- Veritabanı ---------------------------------------------------------
    # SSH olmadığı için migration'ı burada çalıştırıyoruz. Laravel yalnızca
    # HENÜZ ÇALIŞTIRILMAMIŞ migration'ları uygular; mevcut veriye dokunmaz.
    # Seed BİLEREK YOK: her dağıtımda içeriği başa döndürürdü.
    - cd $DEPLOYPATH && php artisan migrate --force

    # --- Önbellekler --------------------------------------------------------
    # Önce temizle, sonra üret. Sıra önemli: eski config cache'i temizlenmeden
    # yeni .env değerleri okunmaz.
    - cd $DEPLOYPATH && php artisan config:clear
    - cd $DEPLOYPATH && php artisan cache:clear
    - cd $DEPLOYPATH && php artisan view:clear
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache

    # --- Yüklenen dosyalar --------------------------------------------------
    # storage/app/public → public/storage bağı. Bu olmadan panelden yüklenen
    # logo, favicon, OG görseli ve iş kapakları sitede görünmez.
    - cd $DEPLOYPATH && php artisan storage:link || true
